<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body class="style-0">
    <div class="style-1">
        <div class="style-2">
            <form method="post" action="/login">
                <div class="style-3">
                    <img src="/static/img/Vector.svg" alt="" class="style-4" />
                    <input type="text" required placeholder="User Name" name="username" class="style-5" />
                    <input type="password" required placeholder="Password" name="password" class="style-6" />
                    <button type="submit" class="style-7">Login</button>
                </div>
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    <div class="alert-popup" id="alert-popup">
                        {{ messages[0] }}
                    </div>
                    <script>
                        $(document).ready(function() {
                            $('#alert-popup').fadeIn().delay(3000).fadeOut();
                        });
                    </script>
                  {% endif %}
                {% endwith %}
            </form>
        </div>
        <h4 class="style-9">Made In Pakistan</h4>
    </div>
</body>
</html>
