<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0f4f8" stroke="#007bff" stroke-width="2"/>
  
  <!-- AI symbol (neural network style) -->
  <g id="ai-symbol">
    <!-- Left neural node -->
    <circle cx="70" cy="70" r="8" fill="#007bff"/>
    <!-- Right neural node -->
    <circle cx="130" cy="70" r="8" fill="#007bff"/>
    <!-- Bottom neural node -->
    <circle cx="100" cy="120" r="8" fill="#007bff"/>
    
    <!-- Connecting lines -->
    <line x1="70" y1="70" x2="100" y2="120" stroke="#007bff" stroke-width="2" opacity="0.6"/>
    <line x1="130" y1="70" x2="100" y2="120" stroke="#007bff" stroke-width="2" opacity="0.6"/>
    <line x1="70" y1="70" x2="130" y2="70" stroke="#007bff" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Clothing icon (shirt outline) -->
  <g id="clothing-symbol" transform="translate(100, 100)">
    <path d="M -20 -15 L -15 -5 L -10 -15 L 10 -15 L 15 -5 L 20 -15 L 20 15 Q 0 25 0 30 Q 0 25 -20 15 Z" 
          fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sleeve dots for inspection marks -->
    <circle cx="-18" cy="5" r="2" fill="#ff6b35"/>
    <circle cx="18" cy="5" r="2" fill="#ff6b35"/>
  </g>
  
  <!-- Text: AI Clothing -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        text-anchor="middle" fill="#007bff">AI CLOTHING</text>
  
  <!-- Accent: Inspection checkmark -->
  <g id="checkmark" transform="translate(155, 40)">
    <path d="M 0 8 L 5 13 L 15 3" stroke="#00cc00" stroke-width="2.5" fill="none" 
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
